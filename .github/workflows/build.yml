name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Version of the llama.cpp engine the app is built with.
  LLAMA_TAG: b12445

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check that the model download links work
        run: |
          status=0
          for url in $(grep -o 'https://huggingface.co[^"]*' App/Models/ModelCatalog.swift); do
            headers=$(curl -sI "$url")
            code=$(echo "$headers" | head -1 | awk '{print $2}')
            size=$(echo "$headers" | grep -i '^x-linked-size' | awk '{print $2}' | tr -d '\r')
            echo "$code  ${size:-?} bytes  $url"
            case "$code" in 200|301|302|307) ;; *) status=1 ;; esac
          done
          exit $status

      - name: Download the llama.cpp engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the pinned version; if its package is not published, take the newest one that is.
          url="https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/llama-${LLAMA_TAG}-xcframework.zip"
          if ! curl -fsL --retry 3 -o llama.zip "$url"; then
            url=$(gh api "repos/ggml-org/llama.cpp/releases?per_page=30" \
              --jq '[.[].assets[] | select(.name | endswith("xcframework.zip")) | .browser_download_url][0]')
            curl -fL --retry 3 -o llama.zip "$url"
          fi
          echo "llama.cpp package: $url"
          unzip -q llama.zip -d llama-unpacked
          mkdir -p Frameworks
          mv llama-unpacked/build-apple/llama.xcframework Frameworks/
          ls Frameworks/llama.xcframework

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild -version
          set +e
          xcodebuild \
            -project PocketAI.xcodeproj \
            -scheme PocketAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          code=$?
          grep -E "error:|warning: var|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -150
          if [ $code -ne 0 ]; then
            echo "----- last lines of the build log -----"
            tail -40 build.log
          fi
          exit $code

      - name: Package the .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PocketAI.app Payload/
          zip -qry PocketAI.ipa Payload
          ls -lh PocketAI.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PocketAI-ipa
          path: PocketAI.ipa

      # The finished app is kept on the "release" branch so it has a permanent download link.
      - name: Publish the .ipa to the release branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir publish
          cp PocketAI.ipa publish/
          cd publish
          git init -q
          git checkout -q -b release
          git add PocketAI.ipa
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Pocket AI build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release
