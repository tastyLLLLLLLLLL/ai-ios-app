name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only the newest commit gets built and published.
concurrency:
  group: build
  cancel-in-progress: true

env:
  # Version of the llama.cpp engine the app is built with.
  LLAMA_TAG: b12445

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check that the model download links work
        run: |
          status=0
          for url in $(grep -o 'https://huggingface.co[^"]*' App/Models/ModelCatalog.swift); do
            headers=$(curl -sI "$url")
            code=$(echo "$headers" | head -1 | awk '{print $2}')
            size=$(echo "$headers" | grep -i '^x-linked-size' | awk '{print $2}' | tr -d '\r')
            echo "$code  ${size:-?} bytes  $url"
            case "$code" in 200|301|302|307) ;; *) status=1 ;; esac
          done
          exit $status

      # The engine is built from source at the pinned version and cached between runs.
      - name: Restore the llama.cpp engine
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: Frameworks/llama.xcframework
          key: llama-device-${{ env.LLAMA_TAG }}

      - name: Build the llama.cpp engine
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp llama-src
          cd llama-src
          ./build-xcframework.sh ios-device > ../llama-build.log 2>&1 || { tail -60 ../llama-build.log; exit 1; }
          cd ..
          mkdir -p Frameworks
          mv llama-src/build-apple/llama.xcframework Frameworks/
          rm -rf llama-src
          ls Frameworks/llama.xcframework

      - name: Save the llama.cpp engine
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Frameworks/llama.xcframework
          key: llama-device-${{ env.LLAMA_TAG }}

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild -version
          set +e
          xcodebuild \
            -project PocketAI.xcodeproj \
            -scheme PocketAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          code=$?
          grep -E "error:|warning: var|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -150
          if [ $code -ne 0 ]; then
            echo "----- last lines of the build log -----"
            tail -40 build.log
          fi
          exit $code

      - name: Check that the alternate app icons are included
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundleAlternateIcons" \
            build/Build/Products/Release-iphoneos/PocketAI.app/Info.plist | grep -c "AppIcon-"

      - name: Package the .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PocketAI.app Payload/
          zip -qry PocketAI.ipa Payload
          ls -lh PocketAI.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PocketAI-ipa
          path: PocketAI.ipa

      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest PocketAI.ipa \
            --target "$GITHUB_SHA" \
            --title "Pocket AI" \
            --notes "Свежая сборка приложения. Скачайте PocketAI.ipa и установите через Sideloadly."
