name: Screenshots

# Runs the app in the iOS Simulator with a real model and publishes
# screenshots to the "screenshots" branch. Runs when the screenshot
# script or this file changes.
on:
  push:
    branches: [main]
    paths:
      - scripts/screenshots.sh
      - .github/workflows/screenshots.yml
  workflow_dispatch:

permissions:
  contents: write

# Only the newest commit gets a screenshot run.
concurrency:
  group: screenshots
  cancel-in-progress: true

env:
  LLAMA_TAG: b12445

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Restore the simulator build of llama.cpp
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: Frameworks/llama.xcframework
          key: llama-sim-${{ env.LLAMA_TAG }}

      - name: Build llama.cpp for the simulator
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp llama-src
          cd llama-src
          ./build-xcframework.sh ios-sim > ../llama-build.log 2>&1 || { tail -60 ../llama-build.log; exit 1; }
          cd ..
          mkdir -p Frameworks
          mv llama-src/build-apple/llama.xcframework Frameworks/
          ls Frameworks/llama.xcframework

      - name: Save the simulator build of llama.cpp
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Frameworks/llama.xcframework
          key: llama-sim-${{ env.LLAMA_TAG }}

      # The newest Xcode, so the screenshots show liquid glass (iOS 26).
      - name: Use the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build the app for the simulator
        run: |
          set +e
          xcodebuild \
            -project PocketAI.xcodeproj \
            -scheme PocketAI \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            build > build.log 2>&1
          code=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -150
          if [ $code -ne 0 ]; then tail -40 build.log; fi
          exit $code

      # The build server has 7 GB of memory, too little to run the 4B model in the
      # simulator, so the screenshot run uses the lighter Qwen3 1.7B.
      - name: Download the model
        run: |
          for url in \
            "https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf" \
            "https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q8_0.gguf"; do
            if curl -fL --retry 2 -o model.gguf "$url"; then
              echo "MODEL_NAME=$(basename "$url")" >> "$GITHUB_ENV"
              echo "Using $url"
              break
            fi
          done
          ls -lh model.gguf

      # Gemma 3 4B with its vision module, to check that photos work.
      - name: Download the vision model
        run: |
          curl -fL --retry 2 -o vision-model.gguf \
            "https://huggingface.co/ggml-org/gemma-3-4b-it-GGUF/resolve/main/gemma-3-4b-it-Q4_K_M.gguf"
          curl -fL --retry 2 -o vision-module.gguf \
            "https://huggingface.co/ggml-org/gemma-3-4b-it-GGUF/resolve/main/mmproj-model-f16.gguf"
          ls -lh vision-model.gguf vision-module.gguf

      - name: Take screenshots
        timeout-minutes: 80
        env:
          VISION_MODEL: vision-model.gguf
          VISION_MODULE: vision-module.gguf
        run: scripts/screenshots.sh build-sim/Build/Products/Release-iphonesimulator/PocketAI.app model.gguf "$MODEL_NAME"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots

      - name: Publish to the screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q
          git checkout -q -b screenshots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Screenshots from the simulator"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
